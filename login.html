<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blush & Bloom - Login</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,-50..200" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Exo 2', sans-serif;
        }

        :root {
            --blue: #0057ff;
            --blue-light: #3d84ff;
            --bg: #000000;
            --card-a: rgba(44, 58, 55, 0.85);
            --card-b: rgba(18, 24, 23, 0.92);
            --white: #ffffff;
            --muted: #b9c2d0;
            --error: #ff6b6b;
        }

        html {
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 22% 62%, rgba(0, 70, 255, 0.38), transparent 42%),
                radial-gradient(circle at 80% 100%, rgba(0, 87, 255, 0.10), transparent 40%),
                var(--bg);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 40px 40px;
            position: relative;
        }

        /* ---------- logo (top-left) ---------- */
        .brand {
            position: absolute;
            top: 28px;
            left: 40px;
        }

        .brand img {
            width: 130px;
            display: block;
        }

        /* ---------- layout ---------- */
        .login-page {
            width: 100%;
            max-width: 1300px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;
        }

        /* ---------- left side ---------- */
        .left-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
        }

        .left-page h1 {
            font-size: 28px;
            font-weight: 500;
            line-height: 1.3;
            max-width: 260px;
        }

        .left-page>p {
            font-size: 15px;
            font-weight: 300;
            line-height: 1.5;
            max-width: 420px;
            color: var(--white);
        }

        .illustration {
            margin-top: 10px;
            width: min(540px, 80%);
            filter: drop-shadow(0 0 40px rgba(0, 87, 255, 0.55));
        }

        .illustration img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ---------- glass card ---------- */
        .right-page {
            display: flex;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 470px;
            padding: 50px 42px 40px;
            border-radius: 44px;
            background: linear-gradient(145deg, var(--card-a), var(--card-b));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.85),
                inset 0 0 45px rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
        }

        .card h2 {
            font-size: 44px;
            font-weight: 400;
            text-align: center;
            color: var(--blue);
            margin-bottom: 28px;
        }

        /* role switch (Admin / Client) */
        .role-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            margin-bottom: 22px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
        }

        .role-btn {
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: .3s ease;
        }

        .role-btn:hover {
            color: var(--white);
        }

        .role-btn.active {
            background: var(--blue);
            color: var(--white);
        }

        /* fields */
        .form-box {
            margin-bottom: 14px;
        }

        .form-box label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--white);
        }

        .inputbox {
            position: relative;
        }

        .inputbox input {
            width: 100%;
            padding: 13px 20px;
            font-size: 14px;
            color: #1a1a1a;
            background: var(--white);
            border: 2px solid transparent;
            border-radius: 999px;
            transition: .3s ease;
        }

        .inputbox input::placeholder {
            color: #3a3a3a;
        }

        .inputbox input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 18px rgba(0, 87, 255, 0.55);
        }

        .inputbox.has-eye input {
            padding-right: 50px;
        }

        .passeye {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            font-size: 20px;
            color: #555;
            cursor: pointer;
            user-select: none;
        }

        .passeye:hover {
            color: var(--blue);
        }

        .errormsg {
            min-height: 16px;
            margin-top: 5px;
            padding-left: 14px;
            font-size: 12px;
            color: var(--error);
        }

        /* remember + forgot */
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 2px 0 26px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--white);
        }

        .remember input {
            width: 15px;
            height: 15px;
            accent-color: var(--blue);
            cursor: pointer;
        }

        .forget {
            text-decoration: none;
            color: var(--blue-light);
            transition: .3s ease;
        }

        .forget:hover {
            text-decoration: underline;
        }

        /* login button */
        .log-btn {
            width: 100%;
            padding: 13px 20px;
            font-size: 17px;
            font-weight: 600;
            color: var(--white);
            background: var(--blue);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: .3s ease;
        }

        .log-btn:hover {
            background: var(--blue-light);
            box-shadow: 0 0 24px rgba(0, 87, 255, 0.6);
        }

        /* or + socials */
        .or {
            text-align: center;
            margin: 20px 0 14px;
            font-size: 15px;
        }

        .log-icons {
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
        }

        .log-icons-pill {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            padding: 8px 20px;
            background: var(--white);
            border-radius: 999px;
        }

        .log-icons-pill a {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            text-decoration: none;
            transition: transform .3s ease;
        }

        .log-icons-pill a:hover {
            transform: translateY(-2px);
        }

        .log-icons-pill .fa-apple {
            color: #000;
        }

        .log-icons-pill .fa-facebook {
            color: #1877f2;
        }

        .log-foot {
            text-align: center;
            font-size: 15px;
        }

        .log-foot a.signup {
            color: var(--blue);
            font-weight: 700;
            text-decoration: none;
        }

        .log-foot a.signup:hover {
            text-decoration: underline;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            transition: .3s ease;
        }

        .home-btn:hover {
            color: var(--blue-light);
        }

        .home-btn span {
            font-size: 18px;
        }

        /* ---------- success popup ---------- */
        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .popup.active {
            display: flex;
        }

        .popup-box {
            width: 350px;
            padding: 34px 30px;
            text-align: center;
            color: var(--white);
            border-radius: 32px;
            background: linear-gradient(145deg, var(--card-a), var(--card-b));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 87, 255, 0.35);
        }

        .success {
            font-size: 60px;
            color: var(--blue);
        }

        .popup-box h3 {
            font-size: 26px;
            font-weight: 500;
            margin: 12px 0 8px;
        }

        .popup-box p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .popup-box button {
            padding: 11px 44px;
            font-size: 15px;
            font-weight: 600;
            color: var(--white);
            background: var(--blue);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: .3s ease;
        }

        .popup-box button:hover {
            background: var(--blue-light);
            box-shadow: 0 0 20px rgba(0, 87, 255, 0.6);
        }

        /* ---------- responsive ---------- */
        @media (max-width: 950px) {
            body {
                padding: 90px 20px 30px;
            }

            .brand {
                left: 20px;
                top: 22px;
            }

            .login-page {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .left-page {
                order: 2;
            }

            .right-page {
                order: 1;
            }

            .illustration {
                width: min(300px, 70%);
            }
        }

        @media (max-width: 500px) {
            .card {
                padding: 36px 22px 30px;
                border-radius: 32px;
            }

            .card h2 {
                font-size: 36px;
            }

            .left-page h1 {
                font-size: 24px;
            }
        }


        
/* loading */

.company-logo img {
    width: clamp(130px,14vw,150px);
}


body.is-loading {
    overflow: hidden;
}

#preloader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity .7s ease, visibility .7s ease;
}

#preloader.done {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.pre-ring {
    position: relative;
    height: 110px;
    width: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.pre-ring::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.08);
    border-top-color: var(--pcolor);
    border-right-color: var(--pcolor);
    animation: preSpin 1s linear infinite;
}

.pre-ring::after {
    content: "";
    position: absolute;
    height: 150px;
    width: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(1, 94, 251, .45), transparent 70%);
    filter: blur(12px);
    animation: prePulse 2s ease-in-out infinite;
    z-index: -1;
}

.pre-ring span.material-symbols-outlined {
    font-size: 42px;
    color: var(--pcolor);
    animation: prePulse 2s ease-in-out infinite;
}

.pre-bar {
    width: min(260px, 70vw);
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
}

.pre-bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--pcolor);
    border-radius: 3px;
    transition: width .25s ease;
}

.pre-text {
    color: white;
    font-size: 14px;
    letter-spacing: 2px;
}

.pre-text b {
    color: var(--pcolor);
    font-weight: 500;
}

@keyframes preSpin {
    to { transform: rotate(360deg); }
}

@keyframes prePulse {
    0%, 100% { opacity: .5; transform: scale(1); }
    50%      { opacity: 1;  transform: scale(1.08); }
}

@media (prefers-reduced-motion: reduce) {
    .pre-ring::before,
    .pre-ring::after,
    .pre-ring span.material-symbols-outlined {
        animation: none;
    }
}

    </style>
</head>

<body>

 
<div id="preloader">

         <a href="index.html" class="company-logo"><img src="./src/logo.webp" alt="company Logo"></a>
    <div class="pre-ring">
        <span class="material-symbols-outlined">shield_lock</span>
    </div>
    <div class="pre-bar"><i></i></div>
    <p class="pre-text">SECURING <b><span id="preCount">0</span>%</b></p>
</div>

    <!-- logo -->
    <a href="index.html" class="brand"><img src="./src/logo.webp" alt="Blush & Bloom logo"></a>

    <section class="login-page">

        <!-- LEFT -->
        <div class="left-page">
            <h1>Welcome back! please login</h1>
            <p>Please enter your email and password to access your account and continue enjoying our services.</p>

            <div class="illustration">
                <img src="./src/login.webp" alt="Secure login">
            </div>
        </div>

        <!-- RIGHT -->
        <div class="right-page">
            <div class="card">

                <h2>Login</h2>

                <div class="role-btns">
                    <button type="button" class="role-btn active" data-role="Admin">Admin</button>
                    <button type="button" class="role-btn" data-role="Client">Client</button>
                </div>

                <div class="form-box">
                    <label for="log-email">Email</label>
                    <div class="inputbox">
                        <input type="email" placeholder="Enter your Email" id="log-email">
                    </div>
                    <p class="errormsg"></p>
                </div>

                <div class="form-box">
                    <label for="log-pass">Password</label>
                    <div class="inputbox has-eye">
                        <input type="password" placeholder="Enter your password" id="log-pass">
                        <span class="material-symbols-outlined passeye">visibility_off</span>
                    </div>
                    <p class="errormsg"></p>
                </div>

                <div class="row">
                    <label class="remember"><input type="checkbox" id="remember"> Remember me ?</label>
                    <a href="404.html" class="forget">Forgot password?</a>
                </div>

                <button class="log-btn" type="button">Login</button>

                <p class="or">or</p>

                <div class="log-icons">
                    <div class="log-icons-pill">
                        <a href="404.html" aria-label="Google">
                            <svg width="22" height="22" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                                <path fill="#EA4335"
                                    d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z" />
                                <path fill="#4285F4"
                                    d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z" />
                                <path fill="#FBBC05"
                                    d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z" />
                                <path fill="#34A853"
                                    d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z" />
                            </svg>
                        </a>
                        <a href="404.html" aria-label="Apple"><i class="fa-brands fa-apple"></i></a>
                        <a href="404.html" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                    </div>
                </div>

                <div class="log-foot">
                    <p>I don't have account <a href="signup.html" class="signup">Sign Up</a></p>
                    <a href="index.html" class="home-btn"><span class="material-symbols-outlined">home</span>Back to
                        home</a>
                </div>

            </div>
        </div>

    </section>

    <script>
        const email = document.querySelector("#log-email");
        const password = document.querySelector("#log-pass");
        const loginBtn = document.querySelector(".log-btn");

        const roleBtns = document.querySelectorAll(".role-btn");
        const eyeIcon = document.querySelector(".passeye");
        const errorMsgs = document.querySelectorAll(".errormsg");

        const popup = document.querySelector("#popup");
        const okBtn = document.querySelector("#okBtn");

        let selectedRole = "Admin";

        // Role selection
        roleBtns.forEach((roles) => {
            roles.addEventListener("click", () => {
                roleBtns.forEach((rls) => rls.classList.remove("active"));
                roles.classList.add("active");
                selectedRole = roles.dataset.role;
            });
        });

        // Show / hide password
        eyeIcon.addEventListener("click", () => {
            if (eyeIcon.textContent.trim() == "visibility_off") {
                eyeIcon.textContent = "visibility";
                password.type = "text";
            } else {
                eyeIcon.textContent = "visibility_off";
                password.type = "password";
            }
        });

        // Login validation
        loginBtn.addEventListener("click", () => {
            let isvalid = true;
            const logregex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            const fe = email.value.trim();
            const fp = password.value.trim();

            errorMsgs.forEach((error) => (error.textContent = ""));

            if (fe == "") {
                errorMsgs[0].textContent = "Enter your email";
                isvalid = false;
            } else if (!logregex.test(fe)) {
                errorMsgs[0].textContent = "Enter a valid email";
                isvalid = false;
            }

            if (fp == "") {
                errorMsgs[1].textContent = "Enter your password";
                isvalid = false;
            } else if (fp.length < 6) {
                errorMsgs[1].textContent = "Password must be at least 6 characters";
                isvalid = false;
            }

            if (isvalid) {


                localStorage.setItem("useremail", email.value);

                if (selectedRole == "Admin") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "client.html";
                }

                email.value = ""
                password.value = ""

            }
        });


        // loading

(function () {
    document.body.classList.add('is-loading');

    var pre   = document.getElementById('preloader');
    var bar   = pre.querySelector('.pre-bar i');
    var count = document.getElementById('preCount');
    var pct = 0, finished = false, timer;

    timer = setInterval(function () {
        if (pct < 90) {
            pct += Math.random() * 8;
            if (pct > 90) pct = 90;
            bar.style.width = pct + '%';
            count.textContent = Math.round(pct);
        }
    }, 150);

    function finish() {
        if (finished) return;
        finished = true;
        clearInterval(timer);
        pct = 100;
        bar.style.width = '100%';
        count.textContent = '100';

        setTimeout(function () {
            pre.classList.add('done');
            document.body.classList.remove('is-loading');
            if (window.__heroTl) window.__heroTl.play();
            if (window.ScrollTrigger) ScrollTrigger.refresh();
        }, 350);
    }

    window.addEventListener('load', finish);
    setTimeout(finish, 6000); // safety fallback
})();


    </script>

</body>

</html>
